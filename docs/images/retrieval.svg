<svg xmlns="http://www.w3.org/2000/svg" width="660" height="590" viewBox="0 0 660 590" role="img" aria-labelledby="title desc">
  <title id="title">Retrieve evidence and answer</title>
  <desc id="desc">Numerical questions use graph retrieval; open-book questions use hybrid retrieval. Graph errors or no evidence fall back to hybrid. Both paths produce an answer with source evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M330 82 V124"/>
    <path d="M220 175 H160 V260"/>
    <path d="M440 175 H600 V420 H590"/>
    <path d="M160 320 V530 H190"/>
    <path d="M490 450 V530 H470"/>
    <path d="M270 290 H330 V420 H390" stroke-dasharray="6 5"/>
  </g>
  <rect x="220" y="22" width="220" height="60" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <path d="M330 125 L440 175 L330 225 L220 175 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <rect x="50" y="260" width="220" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="390" y="390" width="200" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="190" y="500" width="280" height="60" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
    <text x="330" y="59" fill="#0F172A">Question</text>
    <text x="330" y="182" fill="#0F172A">Question type</text>
    <text x="160" y="297" fill="#1E3A8A">Graph retrieval</text>
    <text x="490" y="427" fill="#1E3A8A">Hybrid retrieval</text>
    <text x="330" y="537" fill="#064E3B">Answer with source evidence</text>
    <text x="160" y="239" fill="#475569">Numerical</text>
    <text x="520" y="162" fill="#475569">Open-book</text>
    <text x="90" y="475" fill="#475569">Evidence found</text>
    <text x="435" y="357" fill="#475569">Error or no evidence</text>
  </g>
</svg>
