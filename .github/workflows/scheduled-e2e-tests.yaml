name: Neo4j-GraphRAG Scheduled E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1,4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Skip when E2E tests are not present
        shell: bash
        run: |
          if [ -d tests/e2e ]; then
            echo "tests/e2e exists, but this fork has not enabled Docker E2E CI yet."
            echo "Add the service startup steps back when E2E tests are restored."
            exit 1
          fi
          echo "No tests/e2e directory in this project fork; skipping scheduled E2E job."
