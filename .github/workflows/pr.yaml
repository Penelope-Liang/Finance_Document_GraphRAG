name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen --extra ollama --extra openai --group dev

      - name: Run lint
        run: uv run ruff check src scripts

      - name: Check Python syntax
        run: uv run python -m compileall -q src scripts

      - name: Run tests if present
        shell: bash
        run: |
          if [ -d tests ]; then
            uv run pytest tests
          else
            echo "No tests directory in this project fork; skipping pytest."
          fi

      - name: Build package
        run: uv build
